services:
  typesense:
    image: typesense/typesense:30.2
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY in your environment}"
      - "--enable-cors"

volumes:
  typesense-data:
