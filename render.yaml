services:
  - type: web
    name: snapp-api
    runtime: python
    plan: free
    rootDir: Model
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn model:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
