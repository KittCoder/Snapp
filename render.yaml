services:
  - type: web
    name: snapp-api
    runtime: python
    plan: free
    rootDir: Model
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 model:app
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_TRADER_JOES_ACTOR_ID
        value: merry_arctic~trader-joes-scraper
      - key: CORS_ORIGINS
        value: https://snapp-1d5j.vercel.app
      - key: SNAPP_ENV
        value: production
      - key: SNAPP_LOG_FORMAT
        value: json
      - key: SNAPP_ADMIN_TOKEN
        sync: false
